worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 500M;

    # Redirection HTTP → HTTPS
    server {
        listen 80;
        server_name manage.appteere.com reader.appteere.com appteere.com;
        location / {
            return 301 https://$host$request_uri;
        }
    }



    # Configuration pour manage.plume-story.com (Laravel)
    server {
        listen 443 ssl;
        server_name manage.appteere.com;

        ssl_certificate /etc/nginx/nginx_ssl_manage/fullchain.crt;
        ssl_certificate_key /etc/nginx/nginx_ssl_manage/private.key;
        ssl_trusted_certificate /etc/nginx/nginx_ssl_manage/ca_bundle.crt;

        root /var/www/public;
        index index.php index.html index.htm uploaderFileBook.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass laravel_app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ /\.ht {
            deny all;
        }

        location ~* \.(env|log|gitignore)$ {
            deny all;
        }

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
    }

    # Serveur pour reader.appteere.com (Fichiers statiques)
    server {
        

        root /var/reader;
        index index.html index2.html index-ios.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|html)$ {
            expires max;
            add_header Cache-Control "public";
        }

        location ~ /\.ht {
            deny all;
        }
    }

    # Serveur pour appteere.com (Next.js)
    server {
        listen 443 ssl;
        server_name appteere.com;
        
        ssl_certificate /etc/nginx/ssl/fullchain.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;
        ssl_trusted_certificate /etc/nginx/ssl/ca_bundle.crt;
        
        root /var/appteere_front;
        
        location / {
            proxy_pass http://nextjs:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

    # Assets Next.js : nécessaires pour les JS/CSS/images générés au build
    location /_next/ {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static folder si utilisé (public/static dans Next.js)
    location /static/ {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloque les .htaccess
    location ~ /\.ht {
        deny all;
    }


    }
}
